[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otlab"
version = "0.1.0"
description = "Optimal transport from first principles in NumPy: exact transportation simplex, log domain Sinkhorn, unbalanced OT, barycenters, sliced Wasserstein"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["otlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
